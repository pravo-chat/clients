# Nginx конфигурация для chat.pravochat.ru
# Скопируйте этот файл в /etc/nginx/sites-available/chat.pravochat.ru
# Затем создайте симлинк: ln -s /etc/nginx/sites-available/chat.pravochat.ru /etc/nginx/sites-enabled/
# Проверьте конфигурацию: nginx -t
# Перезагрузите nginx: systemctl reload nginx

# HTTP -> HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name chat.pravochat.ru;

    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS конфигурация
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.pravochat.ru;

    # SSL сертификаты (настройте после установки certbot)
    ssl_certificate /etc/letsencrypt/live/chat.pravochat.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.pravochat.ru/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Проксирование на Next.js приложение
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Для работы WebSocket (если понадобится)
        proxy_set_header Connection "upgrade";
        
        # Таймауты для длительных запросов (стриминг от OpenAI может занимать много времени)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        # Буферизация отключена для стриминга
        proxy_buffering off;
        proxy_cache off;
    }

    # Логи
    access_log /var/log/nginx/chat.pravochat.ru.access.log;
    error_log /var/log/nginx/chat.pravochat.ru.error.log;
}


