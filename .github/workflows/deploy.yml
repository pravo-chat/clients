name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build web application
        run: ./gradlew :composeApp:jsBrowserDistribution

      - name: Create redirect files for SEO
        run: |
          cd composeApp/build/dist/js/productionExecutable
          # Создаем HTML файл для редиректа
          cat > redirect-template.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=/">
              <link rel="canonical" href="https://pravochat.ru/">
              <script>window.location.replace('/');</script>
              <title>Redirecting...</title>
          </head>
          <body>
              <p>Если редирект не произошел автоматически, <a href="/">нажмите здесь</a>.</p>
          </body>
          </html>
          EOF
          # Создаем папку /index с редиректом
          mkdir -p index
          cp redirect-template.html index/index.html
          # Если нет index.html в корне, создаем его (но не перезаписываем существующий)
          if [ ! -f index.html ]; then
            cp redirect-template.html index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: composeApp/build/dist/js/productionExecutable/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
