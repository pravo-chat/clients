# Временная HTTP конфигурация для chat.pravochat.ru
# После получения SSL сертификата будет заменена на полную версию

server {
    listen 80;
    listen [::]:80;
    server_name chat.pravochat.ru;

    # Проксирование на Next.js приложение
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Для работы WebSocket (если понадобится)
        proxy_set_header Connection "upgrade";
        
        # Таймауты для длительных запросов (стриминг от OpenAI может занимать много времени)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        # Буферизация отключена для стриминга
        proxy_buffering off;
        proxy_cache off;
    }

    # Логи
    access_log /var/log/nginx/chat.pravochat.ru.access.log;
    error_log /var/log/nginx/chat.pravochat.ru.error.log;
}


