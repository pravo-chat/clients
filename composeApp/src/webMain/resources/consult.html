<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Консультация юриста — PravoChat</title>
    <meta name="description" content="Оставьте контакты и кратко опишите вопрос — мы свяжемся с вами.">
    <link rel="canonical" href="https://pravochat.ru/consult.html">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F9F9FA;
            color: #0F172A;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 32px 24px 48px 24px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            background: #F9F9FA;
            border-bottom: 1px solid #E6E6E8;
            z-index: 1000;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            font-weight: 700;
            font-size: 20px;
        }
        .brand img { width: 28px; height: 28px; display: block; }
        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0px 24px 48px rgba(20, 30, 80, 0.18);
            margin-top: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            color: #000000;
            margin: 0 0 8px 0;
        }
        p {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            color: #333333;
            margin: 0 0 24px 0;
        }
        label {
            font-size: 16px;
            font-weight: 400;
            color: #000000;
            display: block;
            margin-bottom: 8px;
        }
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #D9D9DC;
            font-size: 16px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #000000;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #308CEF;
        }
        textarea {
            min-height: 96px;
            resize: vertical;
        }
        .form-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        button {
            padding: 8px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 400;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            cursor: pointer;
            transition: opacity 150ms;
        }
        button[type="button"] {
            background: transparent;
            border: 1px solid #D9D9DC;
            color: #000000;
        }
        button[type="submit"] {
            background: #308CEF;
            border: none;
            color: #FFFFFF;
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            .card {
                padding: 20px;
            }
            h1 {
                font-size: 20px;
            }
            p {
                font-size: 14px;
            }
            label {
                font-size: 14px;
                margin-bottom: 6px;
            }
            input,
            textarea {
                padding: 10px;
                font-size: 14px;
            }
            textarea {
                min-height: 80px;
            }
            .form-buttons {
                flex-direction: column-reverse;
                gap: 8px;
            }
            button {
                width: 100%;
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a class="brand" href="/">
            <img src="/images/pravo-logo.svg" alt="PravoChat">
            <span>PravoChat</span>
        </a>
        <nav>
            <a href="/" style="color: #308CEF; text-decoration: none; font-weight: 500;">Главная</a>
        </nav>
    </header>
    <main class="container">
        <div class="card">
            <form method="post" action="#" onsubmit="event.preventDefault(); alert('Спасибо! Мы свяжемся с вами в ближайшее время.'); window.location.href='/';">
                <h1>Консультация юриста</h1>
                <p>Оставьте контакты и кратко опишите вопрос — мы свяжемся с вами.</p>
                <label for="consult-name">Имя</label>
                <input type="text" id="consult-name" name="name" placeholder="Ваше имя" required>
                <label for="consult-email">Email</label>
                <input type="email" id="consult-email" name="email" placeholder="name@example.com" required>
                <label for="consult-question">Ваш вопрос</label>
                <textarea id="consult-question" name="question" placeholder="Коротко опишите ситуацию" required></textarea>
                <div class="form-buttons">
                    <button type="button" onclick="window.location.href='/'">Отмена</button>
                    <button type="submit" class="primary">Отправить</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
